    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Avryx Studio — Video Editing, Thumbnails & AI Films</title>

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link rel="stylesheet" crossorigin href="./assets/index-CXG6b8lq.css">
  </head>
  <body>
    <div id="root"></div>
    <script>
    (function(){
      function add(){
        if(document.querySelector('.mw'))return;
        var s=document.querySelector('.hero-stats');
        if(!s){setTimeout(add,400);return;}
        var d=document.createElement('div');
        d.className='mw reveal';
        d.innerHTML='<span class="mw-label">Videos made with</span><div class="mw-row">'
        +'<div class="mw-badge"><span class="mw-tile mw-t-seedance">S<em>2.5</em></span><span class="mw-meta"><b>Seedance 2.5</b><i>AI Video Engine</i></span><span class="mw-shine"></span></div>'
        +'<div class="mw-badge"><span class="mw-tile mw-t-pr">Pr</span><span class="mw-meta"><b>Premiere Pro</b><i>Editing</i></span><span class="mw-shine"></span></div>'
        +'<div class="mw-badge"><span class="mw-tile mw-t-ae">Ae</span><span class="mw-meta"><b>After Effects</b><i>Motion Graphics</i></span><span class="mw-shine"></span></div>'
        +'</div>';
        s.after(d);
        var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){d.classList.add('in');io.disconnect();}})},{threshold:.1});
        io.observe(d);
      }
      if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',add);else add();
    })();
    </script>
  </body>
